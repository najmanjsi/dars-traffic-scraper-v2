<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Vizualizacija gostote Ljubljanskega prometa (arhiv)</title>

        <link rel="icon" type="image/x-icon" href="/images/car.png">

        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="weather-icons-master/css/weather-icons.css">
    </head>
    <body>
        <div id="controls">
            <button id="playBtn">▶ Start</button>
            <!--<button id="pauseBtn">Stop</button>-->

            <br><br>

            Hitrost:
            <select id="speedSelect">
                <option value="1000">1x</option>
                <option value="500" selected>2x</option>
                <option value="250">4x</option>
                <option value="100">10x</option>
            </select>

            <br><br>

            <input type="range" id="timeline" min="0" max="0" value="0">

            <br><br>

            Datum:
            <select id="daySelect"></select>

            <br><br>

            <div id="timestamp">Timestamp</div>

            <br><br>

            <button id="colorModeBtn">
                Pobarvaj interpolirano
            </button>
            
            <br><br>
            

            <button id="legendBtn">
                Legenda
            </button>
            
            <br>

            <div id="legend">
                <!--hr style="width: 50%;text-align: left;margin-left: 0;"-->

                <div>
                    <span style="color: #008E30">
                        &#9632;
                    </span>
                    Miren promet
                </div>

                <div>
                    <span style="color: #F49E00">
                        &#9632;
                    </span>
                    Normalen promet
                </div>

                <div>
                    <span style="color: #E2001A">
                        &#9632;
                    </span>
                    Gost promet
                </div>

                <div>
                    <span style="color: #9E0F00">
                        &#9632;
                    </span>
                    Zelo gost promet
                </div>

                <!--
                <div style="color: #008E30">
                    &#9632;
                    Miren promet
                </div>
                <div style="color: #F49E00">
                    &#9632;
                    Nekaj prometa
                </div>
                <div style="color: #E2001A">
                    &#9632;
                    Gost promet
                </div>
                <div style="color: #9E0F00">
                    &#9632;
                    Zelo gost promet
                </div>
                -->
            </div>

            <br><br>

            <button id="weatherBtn">
                Vreme
            </button>

            <br>

            <div id="weather">
                <p id="wthr">vreme: <i class="wi wi-day-sunny" id="wthrIcon"></i></p>
                <p id="prcpttn">padavine: 0mm</p>
                <p id="tmprtr">temperatura: 0°C</p>
            </div>

        </div>

        <div id="map"></div>

        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
        <script type="module" src="app.js"></script>

        <div id="loadingOverlay">
            <div id="loadingText">
                Nalaganje prometnih podatkov
            </div>
        </div>
    </body>
</html>
